name: Publish Python packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-cfgit:
    name: Publish cfgit
    runs-on: ubuntu-latest
    environment: pypi-cfgit
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install -U build twine
          python -m build
          python -m twine check dist/*
      - name: Publish cfgit to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-cfgit-impact:
    name: Publish cfgit-impact
    runs-on: ubuntu-latest
    needs: publish-cfgit
    environment: pypi-cfgit-impact
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        working-directory: plugins/cfg_impact
        run: |
          python -m pip install -U build twine
          python -m build
          python -m twine check dist/*
      - name: Publish cfgit-impact to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: plugins/cfg_impact/dist/
