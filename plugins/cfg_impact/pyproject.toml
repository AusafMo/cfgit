[project]
name = "cfg-impact"
version = "0.1.1"
description = "Optional cfg-impact plugin for deterministic system-impact summaries and opt-in LLM narration of database record diffs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mohammad Ausaf" }]
dependencies = [
  "cfg-vcs>=0.1.1,<0.2.0",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/AusafMo/cfgit"
Repository = "https://github.com/AusafMo/cfgit"
Issues = "https://github.com/AusafMo/cfgit/issues"
Documentation = "https://github.com/AusafMo/cfgit/tree/main/plugins/cfg_impact#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfg_impact"]
