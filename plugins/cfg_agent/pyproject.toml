[project]
name = "cfgit-agent"
version = "0.4.1"
description = "Optional cfgit plugin for multi-agent coordination over live database records"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mohammad Ausaf" }]
dependencies = [
  "cfgit>=0.4.1,<0.5.0",
]

[project.optional-dependencies]
mongo = ["cfgit[mongo]>=0.4.1,<0.5.0"]
postgres = ["cfgit[postgres]>=0.4.1,<0.5.0"]
mcp = ["cfgit[mcp]>=0.4.1,<0.5.0"]
all = [
  "cfgit[mongo,postgres,mcp]>=0.4.1,<0.5.0",
]

[project.urls]
Homepage = "https://github.com/AusafMo/cfgit"
Repository = "https://github.com/AusafMo/cfgit"
Issues = "https://github.com/AusafMo/cfgit/issues"
Documentation = "https://github.com/AusafMo/cfgit/tree/main/plugins/cfg_agent#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfg_agent"]
